<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>Argus Eyes — land · air · sea</title>
    <meta name="description" content="Argus Eyes — real-time land, air & sea situational awareness" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f5f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#060a12" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TK2DCK71CN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-TK2DCK71CN');
    </script>
    <script>
      // Apply the theme before first paint to avoid a flash: an explicit saved
      // choice wins, otherwise follow the OS prefers-color-scheme.
      (function () {
        try {
          var t = localStorage.getItem("ais.theme.v2");
          var dark =
            t === "light" || t === "dark"
              ? t === "dark"
              : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
