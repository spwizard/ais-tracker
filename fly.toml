# Fly.io config — ONE app serving both the API/WebSocket and the built frontend.
# A SINGLE always-on instance: it holds one upstream AIS connection + in-memory
# state and fans out over WebSocket. Do not scale beyond 1 machine until the
# Redis pub/sub fan-out is added (`fly scale count 1`).
app = "ais-tracker"          # change to your app name (and frontend/.env.production)
primary_region = "lhr"       # London — close to the default UK/Channel AIS bbox

[build]

# Data paths point at the persistent volume (registry + geofences survive
# restarts; ownership.sqlite + sanctions.json are uploaded/built there once).
[env]
  PORT = "8000"                 # must match http_service.internal_port below
  OWNERSHIP_PATH = "/app/data/ownership.sqlite"
  SANCTIONS_PATH = "/app/data/sanctions.json"
  REGISTRY_PATH = "/app/data/registry.sqlite"
  GEOFENCE_PATH = "/app/data/geofences.json"
  BRIEFING_WEB_SEARCH = "false"   # opt-in per request via the UI checkbox

[http_service]
  internal_port = 8000
  force_https = true
  # Portfolio demo: sleep when idle, wake on the next visit. Near-zero cost —
  # you only pay while someone is actually viewing it. Trade-off: on a cold
  # visit the map is empty for ~30-60s while the AIS feed reconnects and fills.
  # (For 24/7 data collection, set auto_stop_machines = "off" + min = 1 — but
  #  that's the ~$5/mo always-on bill.)
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"                 # cheaper; bump back to 1gb only if it OOMs

[mounts]
  source = "ais_data"
  destination = "/app/data"

[checks]
  [checks.health]
    type = "http"
    port = 8000
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "25s"
