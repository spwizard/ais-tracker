# fly.toml app configuration file generated for ais-tracker-5jj-yg on 2026-06-05T20:43:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ais-tracker-5jj-yg'
primary_region = 'lhr'

[build]

[env]
  BRIEFING_WEB_SEARCH = 'false'
  GEOFENCE_PATH = '/app/data/geofences.json'
  OWNERSHIP_PATH = '/app/data/ownership.sqlite'
  REGISTRY_PATH = '/app/data/registry.sqlite'
  SANCTIONS_PATH = '/app/data/sanctions.json'

[[mounts]]
  source = 'ais_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 800

[checks]
  [checks.health]
    port = 8000
    type = 'http'
    interval = '15s'
    timeout = '5s'
    grace_period = '25s'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
